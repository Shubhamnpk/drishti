name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-drishti
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: bun run build

      - name: Ship and swap
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          HOST=ubuntu@137.23.48.14

          echo "::group::sync source"
          ssh -i /tmp/deploy_key $SSH_OPTS $HOST 'cd ~/drishti && git fetch --prune origin && git reset --hard origin/main'
          echo "::endgroup::"

          echo "::group::ship build"
          rsync -az --delete --exclude cache \
            -e "ssh -i /tmp/deploy_key $SSH_OPTS" \
            .next/ $HOST:/home/ubuntu/drishti/.next-new/
          echo "::endgroup::"

          echo "::group::swap and restart"
          ssh -i /tmp/deploy_key $SSH_OPTS $HOST 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          cd "$HOME/drishti"
          bun install --frozen-lockfile

          rm -rf .next.old
          mv .next .next.old
          mv .next-new .next

          sudo systemctl restart drishti
          sleep 6
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:3000/ || echo 000)
          if [ "$code" != "200" ]; then
            echo "health check failed ($code) - rolling back"
            rm -rf .next && mv .next.old .next
            sudo systemctl restart drishti
            exit 1
          fi
          rm -rf .next.old
          echo "deployed $(git rev-parse --short HEAD)"
          REMOTE
          echo "::endgroup::"
